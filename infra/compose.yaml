name: personal-workbench

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WORKBENCH_DB_NAME:-workbench}
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - ${WORKBENCH_HOST_ROOT:-../workbench-data}/database/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workbench -d ${WORKBENCH_DB_NAME:-workbench}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      COOKIE_SECURE: 'true'
      DATABASE_URL: postgres://workbench@postgres:5432/${WORKBENCH_DB_NAME:-workbench}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      WORKBENCH_ROOT: /srv/workbench
      WORKBENCH_ID: ${WORKBENCH_ID:-00000000-0000-4000-8000-000000000001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - postgres_password
    volumes:
      - ${WORKBENCH_HOST_ROOT:-../workbench-data}:/srv/workbench
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      DOMAIN_ALIAS_1: ${DOMAIN_ALIAS_1:-http://domain-alias-1.invalid}
      DOMAIN_ALIAS_2: ${DOMAIN_ALIAS_2:-http://domain-alias-2.invalid}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, backend]

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
